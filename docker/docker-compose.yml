version: "3.9"
services:
  qepc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ORFS_COMMIT: "a1b2c3d"
    image: qepc-orfs:latest
    volumes:
      - ..:/workspace
      - ./asap7_pdk:/ORFS/flow/platforms/asap7/pdk:ro
      - ../results:/workspace/results
    environment:
      - DESIGN_NAME=mac32
      - PLATFORM=asap7
      - PLACE_DENSITY=0.65
      - QEPC_ENABLE=1
      - QEPC_MAX_ITER=200
      - QEPC_LAMBDA=0.20
      - QEPC_KAPPA=0.30
      - QEPC_SIGMA_B=3.0
      - QEPC_XI=0.40
      - QEPC_ALPHA0=2.0
      - QEPC_TC0=0.05
      - QEPC_EPSILON=0.0001
    working_dir: /workspace
    command: make -f flow/Makefile qepc
